# Repo-local mise config: dotfiles orchestration tasks + the tools they need.
# This mirrors the Justfile recipes so `mise run <task>` and `just <recipe>` both
# work during the migration. User-level tools (python, uv, ansible) stay in the
# stowed ~/.config/mise/config.toml (mise/.config/mise/config.toml here).
#
# First run in a fresh clone: `mise trust`, then `mise run install`.

[tools]
# Orchestration deps, so `mise run` works before `brew` has run.
# (stow is not in the mise registry — it stays brew-managed via the Brewfile.)
sops = "latest"
age = "latest"
jq = "latest"

[vars]
# Stow packages that map into $HOME. macos/ and secrets/ are intentionally excluded.
packages = "aerospace direnv fish ghostty git mise starship zellij zsh"

# Show available tasks.
[tasks.default]
run = "mise tasks"

# Full deploy. The op-gated secrets step runs last; every task is idempotent,
# so if 1Password CLI integration isn't enabled yet, enable it and re-run.
[tasks.install]
depends = ["brew", "stow", "macos", "claude-cli", "codex-cli", "grok-cli", "opencode-cli", "pi-cli", "secrets"]
run = '''echo "Done. Open a new login shell, then run 'mise run doctor' to verify."'''

# Install everything in the Brewfile (brews, casks, fonts, VS Code extensions).
# Third-party taps outside Homebrew's curated allowlist need explicit trust
# (brew >=6) before their formulae/casks can load.
[tasks.brew]
shell = "bash -c"
run = '''
set -euo pipefail
grep -E '^tap "' "{{config_root}}/macos/Brewfile" | sed -E 's/^tap "([^"]+)".*/\1/' | while read -r t; do
  brew tap "$t"
  brew trust --tap "$t"
done
brew bundle --file="{{config_root}}/macos/Brewfile"
'''

# Decrypt sops secrets into ~/.config/secrets/env.sh (sourced by .zprofile).
# Keyless: sops (>=3.10) fetches the age key live from 1Password via
# SOPS_AGE_KEY_CMD; the private key never touches disk. Override the 1Password
# reference per-machine with OP_AGE_REF if vault/item/field names differ.
[tasks.secrets]
shell = "bash -c"
run = '''
set -euo pipefail
if ! command -v op >/dev/null 2>&1; then
  echo "op CLI not found — run 'mise run brew' (installs 1password-cli) first." >&2
  exit 1
fi
if ! op whoami >/dev/null 2>&1; then
  echo "1Password CLI not authenticated — attempting 'op signin'..." >&2
  eval "$(op signin)" || {
    echo "Sign-in failed. Enable 1Password app → Settings → Developer → 'Integrate with 1Password CLI'." >&2
    exit 1
  }
fi
export SOPS_AGE_KEY_CMD="op read ${OP_AGE_REF:-op://Private/sops/SOPS_PRIVATE_KEY}"
umask 077
mkdir -p "$HOME/.config/secrets"
sops -d --output-type dotenv "{{config_root}}/secrets/env.sops.yaml" \
  | sed -E 's/^/export /' > "$HOME/.config/secrets/env.sh"
chmod 600 "$HOME/.config/secrets/env.sh"
echo "Wrote ~/.config/secrets/env.sh (sourced by .zprofile on next login shell)."
'''

# Symlink dotfiles into $HOME via GNU Stow.
[tasks.stow]
shell = "bash -c"
run = '''
set -euo pipefail
# Pre-create fold targets so runtime dirs such as ~/.ssh/known_hosts stay real
# and out of the repo instead of being folded into a package symlink.
mkdir -p ~/.config ~/.ssh
chmod 700 ~/.ssh
echo "--- dry run ---"
cd "{{config_root}}" && stow -n -v -t ~ {{vars.packages}}
echo "--- applying ---"
cd "{{config_root}}" && stow -v -t ~ {{vars.packages}}
'''

# Apply macOS system defaults.
[tasks.macos]
run = 'bash "{{config_root}}/macos/defaults"'

# Install the Claude Code CLI if missing (official installer).
[tasks.claude-cli]
shell = "bash -c"
run = '''
set -euo pipefail
if command -v claude >/dev/null 2>&1; then
  echo "claude already installed: $(claude --version 2>/dev/null || echo present)"
else
  echo "Installing Claude Code CLI"
  curl -fsSL https://claude.ai/install.sh | bash
fi
'''

# Install the Codex CLI if missing (official installer).
[tasks.codex-cli]
shell = "bash -c"
run = '''
set -euo pipefail
if command -v codex >/dev/null 2>&1; then
  echo "codex already installed: $(codex --version 2>/dev/null || echo present)"
else
  echo "Installing Codex CLI"
  curl -fsSL https://chatgpt.com/codex/install.sh | sh
fi
'''

# Install the Grok CLI if missing (official installer).
[tasks.grok-cli]
shell = "bash -c"
run = '''
set -euo pipefail
if command -v grok >/dev/null 2>&1; then
  echo "grok already installed: $(grok --version 2>/dev/null || grok version 2>/dev/null || echo present)"
else
  echo "Installing Grok CLI"
  curl -fsSL https://x.ai/cli/install.sh | bash
fi
'''

# Install the OpenCode CLI if missing (official Homebrew formula).
[tasks.opencode-cli]
shell = "bash -c"
run = '''
set -euo pipefail
if command -v opencode >/dev/null 2>&1; then
  echo "opencode already installed: $(opencode --version 2>/dev/null || echo present)"
else
  echo "Installing OpenCode CLI"
  brew install anomalyco/tap/opencode
fi
'''

# Install the Pi coding-agent CLI if missing.
[tasks.pi-cli]
shell = "bash -c"
run = '''
set -euo pipefail
if ! command -v brew >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
  echo "Pi requires Homebrew Node/npm — run 'mise run brew' first." >&2
  exit 1
fi
brew_prefix="$(brew --prefix)"
pi_runtime="$brew_prefix/bin/pi"
if npm ls -g --prefix "$brew_prefix" --depth=0 @earendil-works/pi-coding-agent >/dev/null 2>&1 \
  && [ -x "$pi_runtime" ]; then
  echo "pi already installed: $($pi_runtime --version 2>/dev/null || echo present)"
else
  echo "Installing Pi coding agent"
  npm install -g --prefix "$brew_prefix" --ignore-scripts @earendil-works/pi-coding-agent
fi
'''

# Verify a deployed machine.
[tasks.doctor]
shell = "bash -c"
run = '''
set -uo pipefail
ok() { printf '  \033[1;32mok\033[0m  %s\n' "$1"; }
bad() { printf '  \033[1;31mXX\033[0m  %s\n' "$1"; }
echo "Tooling:"
for t in brew stow sops age just mise jq; do
  command -v "$t" >/dev/null 2>&1 && ok "$t" || bad "$t missing"
done
echo "AI CLIs:"
for t in claude codex grok opencode pi; do
  command -v "$t" >/dev/null 2>&1 && ok "$t" || bad "$t missing"
done
echo "Symlinks:"
for f in ~/.zshrc ~/.config/ghostty/config ~/.config/starship.toml; do
  [ -L "$f" ] || [ -f "$f" ] && ok "$f" || bad "$f missing"
done
echo "Secrets:"
SOPS_AGE_KEY_CMD="op read ${OP_AGE_REF:-op://Private/sops/SOPS_PRIVATE_KEY}" \
  sops -d "{{config_root}}/secrets/env.sops.yaml" >/dev/null 2>&1 \
  && ok "secrets decrypt (keyless via 1Password)" \
  || bad "secrets decrypt failed (op authenticated? sops >= 3.10?)"
[ -f "$HOME/.config/sops/age/keys.txt" ] \
  && bad "legacy key file on disk — remove with: rm ~/.config/sops/age/keys.txt" \
  || ok "no age key on disk"
[ -f "$HOME/.config/secrets/env.sh" ] && ok "env.sh generated" || bad "env.sh missing (run 'mise run secrets')"
echo "1Password:"
if command -v op >/dev/null 2>&1; then
  op whoami >/dev/null 2>&1 && ok "op authenticated" || bad "op not authenticated (enable CLI integration)"
else
  bad "op CLI missing"
fi
[ -f "$HOME/.ssh/config" ] && ok "~/.ssh/config present" || bad "~/.ssh/config missing (run 'mise run stow')"
'''
