"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# scan_timeout is in MILLISECONDS (default 30). Keep it small-but-sane so the
# prompt stays responsive if a network filesystem (e.g. pCloud Drive) stalls,
# without timing out on every normal directory scan.
scan_timeout = 30

# Icons based on https://starship.rs/presets/nerd-font
# Keep all built-in modules available; each uses its own context detection.
format = "$username$hostname$directory$all"

right_format = "$cmd_duration"
palette = "rose_pine_moon"

[character]
success_symbol = "[❯](bold foam)"
error_symbol = "[✖](bold love)"

[cmd_duration]
min_time = 500

[username]
disabled = false
show_always = false

[hostname]
disabled = false
ssh_only = true
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style) "
style = "bold yellow"

[directory]
disabled = false
truncation_length = 8
truncate_to_repo = true
read_only = " 󰌾"
home_symbol = "~"
style = "bold rose"

[directory.substitutions]
"~/.dotfiles" = "dotfiles"

[kubernetes]
disabled = false
# detect_env_vars is intentionally absent: with detect_files/folders set,
# starship 1.26 never consults it (Option::or short-circuits on Some(false))
detect_files = ["kustomization.yaml", "Chart.yaml", "helmfile.yaml"]
detect_folders = ["kubernetes", "k8s"]
symbol = "󱃾 "
format = "[\\[$symbol$context \\($namespace\\)\\]]($style) "
style = "bold foam"

[python]
disabled = false
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = "🐍 "
style = "bold gold"

[git_branch]
disabled = false
symbol = " "

[git_status]
disabled = false
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[git_commit]
disabled = false
commit_hash_length = 8
only_detached = true
style = "muted"
tag_symbol = " "

[aws]
disabled = true
symbol = "☁️ AWS "

[azure]
symbol = "☁️ Azure "
disabled = false

