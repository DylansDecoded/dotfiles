# Colors follow Rose Pine Moon, including modules that use standard color names.
[palettes.rose_pine_moon]
love = "#eb6f92"
gold = "#f6c177"
rose = "#ea9a97"
pine = "#3e8fb0"
foam = "#9ccfd8"
