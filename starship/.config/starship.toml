green = "#9ccfd8"
yellow = "#f6c177"
blue = "#9ccfd8"
purple = "#c4a7e7"
cyan = "#ea9a97"
white = "#e0def4"

# Project configuration indicators, not running-agent or authentication status.
# Detection checks the current directory and never launches an agent CLI.
[custom.agents]
description = "Shared agent instructions in this project directory"
detect_files = ["AGENTS.md"]
require_repo = true
symbol = "🤖 "
format = '[${symbol}agents]($style) '
style = "bold iris"

[custom.claude]
description = "Claude configuration in this project directory"
detect_files = ["CLAUDE.md"]
detect_folders = [".claude"]
require_repo = true
symbol = "✳ "
format = '[${symbol}Claude]($style) '
style = "bold rose"

[custom.codex]
description = "Codex configuration in this project directory"
detect_folders = [".codex"]
require_repo = true
symbol = "🤖 "
format = '[${symbol}Codex]($style) '
style = "bold foam"

[custom.gemini]
description = "Gemini configuration in this project directory"
detect_files = ["GEMINI.md"]
detect_folders = [".gemini"]
require_repo = true
symbol = "✦ "
format = '[${symbol}Gemini]($style) '
style = "bold iris"

[custom.opencode]
description = "OpenCode configuration in this project directory"
detect_files = ["opencode.json", "opencode.jsonc"]
detect_folders = [".opencode"]
require_repo = true
symbol = "󰚩 "
format = '[${symbol}OpenCode]($style) '
style = "bold gold"
